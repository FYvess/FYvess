name: Generate snake animation

on:
  schedule: # execute every 12 hours, on the hour
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#00FF41,#10B981,#14B8A6&color_dots=#161b22,#0a2e1a,#0d4a29,#10B981,#00FF41
            dist/snake-light.svg?color_snake=#059669,#10B981,#14B8A6&color_dots=#ebedf0,#b6f2d4,#6ee7a8,#34d399,#10B981


      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}