name: Generate snake animation

on:
  schedule: # execute every 12 hours, on the hour
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0a0a0a,#1b3b0f,#0a0a0a,#2f6d1a,#0a0a0a,#4fae21&color_dots=#161b22,#153a1f,#1f6b34,#3fae46,#8DB600
            dist/snake-light.svg?color_snake=#111111,#1b3b0f,#111111,#2f6d1a,#111111,#4fae21&color_dots=#ebedf0,#cdeccb,#9ad78f,#5fbf5a,#8DB600


      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}